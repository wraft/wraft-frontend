name: Build and Push Docker Image

on:
  push:
    tags: ['*.*.*']

env:
  REGISTRY: quay.io
  IMAGE_NAME: wraft-frontend

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract organization name
        id: extract_org
        run: |
          ORG_NAME=$(echo "${{ secrets.QUAY_USERNAME }}" | cut -d'+' -f1)
          echo "ORG_NAME=${ORG_NAME}" >> $GITHUB_ENV

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Smoke test runtime dependencies in runner image
        run: |
          docker buildx build --target runner --load -t wraft-frontend-smoke -f docker/Dockerfile .
          docker run --rm wraft-frontend-smoke sh -c "test -f /app/node_modules/@reduxjs/toolkit/dist/redux-toolkit.modern.mjs"
          docker run --rm wraft-frontend-smoke sh -c "test -f /app/node_modules/redux/package.json"
          docker run --rm wraft-frontend-smoke sh -c "test -f /app/node_modules/redux-thunk/package.json"
          docker run --rm wraft-frontend-smoke sh -c "test -f /app/node_modules/immer/package.json"
          docker run --rm wraft-frontend-smoke sh -c "test -f /app/node_modules/reselect/package.json"
          CONTAINER_ID=$(docker run -d wraft-frontend-smoke)
          sleep 8
          docker logs "$CONTAINER_ID"
          RUNNING=$(docker inspect -f '{{.State.Running}}' "$CONTAINER_ID")
          docker rm -f "$CONTAINER_ID" >/dev/null 2>&1 || true
          if [ "$RUNNING" != "true" ]; then
            echo "Runner container exited during smoke startup check."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Quay.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_ROBOT_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.ORG_NAME }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
